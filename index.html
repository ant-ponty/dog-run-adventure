<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dog Run Adventure</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Comic Sans MS','Chalkboard SE',sans-serif}
body{background:#87CEEB;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
#wrap{position:relative;width:100%;max-width:960px}
canvas{display:block;width:100%;background:#87CEEB;border-radius:12px;touch-action:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(20,30,60,.92);color:#fff;border-radius:12px;text-align:center;padding:20px;z-index:10}
.hidden{display:none!important}
h1{font-size:2.2em;color:#FFD93D;text-shadow:2px 2px 0 #e07b00;margin-bottom:10px}
button{background:#FF6B6B;color:#fff;border:none;border-radius:30px;padding:12px 28px;font-size:1.1em;cursor:pointer;margin:6px;box-shadow:0 4px 0 #c0392b;transition:.1s}
button:hover{transform:scale(1.05)}
button:active{transform:translateY(3px);box-shadow:none}
.breeds{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0}
.breed{background:#2c3e50;border:3px solid transparent;border-radius:14px;padding:12px;width:190px;cursor:pointer;transition:.15s}
.breed:hover{border-color:#FFD93D;transform:scale(1.04)}
.breed .emo{font-size:2.4em}
.breed h3{color:#FFD93D;margin:4px 0}
.breed p{font-size:.8em;color:#cfd8dc;line-height:1.4}
#hud{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;color:#fff;font-weight:bold;text-shadow:1px 1px 2px #000;z-index:5;pointer-events:none;font-size:clamp(11px,2vw,16px)}
#progress{position:absolute;bottom:8px;left:10%;width:80%;height:10px;background:rgba(0,0,0,.4);border-radius:5px;z-index:5}
#pbar{height:100%;width:0;background:#FFD93D;border-radius:5px}
#touch{position:absolute;bottom:26px;width:100%;display:none;justify-content:space-between;padding:0 20px;z-index:6}
.tbtn{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.35);border:2px solid #fff;color:#fff;font-size:1.8em;display:flex;align-items:center;justify-content:center;user-select:none}
#muteBtn{position:absolute;top:36px;right:10px;z-index:6;background:rgba(0,0,0,.4);box-shadow:none;padding:6px 10px;font-size:1em}
@media(pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv" width="960" height="540"></canvas>
<div id="hud"><span id="hBreed"></span><span id="hLives"></span><span id="hScore"></span><span id="hLevel"></span><span id="hPow"></span></div>
<div id="progress"><div id="pbar"></div></div>
<button id="muteBtn">🔊</button>
<div id="touch"><div class="tbtn" id="tDown">⬇</div><div class="tbtn" id="tUp">⬆</div></div>

<div class="screen" id="menu">
<h1>🐶 Dog Run Adventure</h1>
<p>Corri, salta e abbassati per raggiungere il traguardo!</p>
<p>⬆/W salta &nbsp;•&nbsp; ⬇/S ti abbassi &nbsp;•&nbsp; Touch su mobile</p>
<div class="breeds" id="breedList"></div>
</div>
<div class="screen hidden" id="pauseS"><h1>⏸ Pausa</h1><button onclick="togglePause()">Riprendi</button><button onclick="toMenu()">Menu</button></div>
<div class="screen hidden" id="lvlS"><h1 id="lvlT">🎉 Livello completato!</h1><p id="lvlP"></p><button onclick="nextLevel()">Livello successivo ▶</button></div>
<div class="screen hidden" id="overS"><h1>💔 Game Over</h1><p id="overP"></p><button onclick="restart()">Ricomincia</button><button onclick="toMenu()">Menu</button></div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=960,H=540,GY=460;
const BREEDS=[
{n:'Border Collie',e:'🐕',spd:1.15,jmp:1.0,duck:1.0,lives:3,d:'Veloce, salto normale'},
{n:'Labrador',e:'🦮',spd:1.0,jmp:1.0,duck:1.0,lives:4,d:'Equilibrato, 4 vite'},
{n:'Jack Russell',e:'🐶',spd:0.95,jmp:1.25,duck:1.0,lives:3,d:'Salto altissimo'},
{n:'Bassotto',e:'🌭',spd:0.9,jmp:0.9,duck:1.6,lives:4,d:'Abbassamento lungo, 4 vite'}];
const THEMES=[{sky:'#87CEEB',gnd:'#7ec850',deco:'🌳',n:'Parco'},{sky:'#9fb6c3',gnd:'#888',deco:'🏢',n:'Città'},{sky:'#FFE29A',gnd:'#f4d58d',deco:'🌴',n:'Spiaggia'},{sky:'#aee9ff',gnd:'#a4c639',deco:'🌻',n:'Campagna'},{sky:'#c39bd3',gnd:'#9b59b6',deco:'🍄',n:'Mondo fantastico'}];
let breed=null,level=1,score=0,lives=3,state='menu',paused=false,muted=false;
let camX=0,levelLen=0,obs=[],enemies=[],pows=[],plats=[],flag=null;
let dog={x:80,y:GY,vy:0,w:44,h:40,onG:true,duck:0,inv:0,dj:0,djUsed:false,spdT:0,mult:0,hurt:0,anim:0};
let AC=null,musicInt=null;
function audio(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC}
function beep(f,d,type='square',v=.15){if(muted)return;try{const a=audio(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function startMusic(){if(musicInt)return;let i=0;const mel=[262,330,392,330,294,349,440,349];musicInt=setInterval(()=>{if(!muted&&state==='play'&&!paused)beep(mel[i++%8],.25,'triangle',.06)},300)}
// --- Level generation ---
function genLevel(lv){
 obs=[];enemies=[];pows=[];plats=[];levelLen=3800+lv*700;
 let x=500;
 while(x<levelLen-500){
  const r=Math.random(),diff=Math.min(1,lv*.15);
  if(r<.25){obs.push({x,y:GY-45,w:30,h:45,t:'low'})}
  else if(r<.45){obs.push({x,y:GY-110,w:40,h:70,t:'high'})}
  else if(r<.62){const w=90+Math.random()*70*diff+40;obs.push({x,y:GY,w,h:200,t:'hole'})}
  else if(r<.78){enemies.push({x,y:GY-34,w:36,h:34,dir:1,range:120+Math.random()*80,x0:x,spd:(1+lv*.2)*(Math.random()<.5?1:-1)})}
  else{const py=GY-120-Math.random()*60;plats.push({x,y:py,w:120,h:18});plats.push({x:x+140,y:py-70,w:100,h:18});if(Math.random()<.7)pows.push({x:x+160,y:py-110,w:26,h:26,t:randPow()})}
  if(Math.random()<.3)pows.push({x:x+60,y:GY-70,w:26,h:26,t:randPow()});
  x+=280+Math.random()*220-Math.min(100,lv*10);
 }
 flag={x:levelLen-100,y:GY-140,w:12,h:140};
}
function randPow(){const p=['inv','dj','spd','life','mult'];return p[Math.random()*p.length|0]}
function resetDog(fromStart){
 dog.y=GY;dog.vy=0;dog.duck=0;dog.inv=fromStart?0:120;dog.dj=0;dog.djUsed=false;dog.spdT=0;dog.mult=0;dog.hurt=0;
 camX=0;dog.x=80;
}
function startLevel(){genLevel(level);resetDog(true);state='play';hideAll();startMusic()}
function hideAll(){['menu','pauseS','lvlS','overS'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
// --- Input ---
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key.startsWith('Arrow'))e.preventDefault();if(e.key.toLowerCase()==='p'&&state==='play')togglePause()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function bindTouch(id,k){const el=document.getElementById(id);el.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();keys[k]=false},{passive:false})}
bindTouch('tUp','arrowup');bindTouch('tDown','arrowdown');
document.getElementById('muteBtn').onclick=()=>{muted=!muted;document.getElementById('muteBtn').textContent=muted?'🔇':'🔊'};
// --- Menu breed selection ---
const bl=document.getElementById('breedList');
BREEDS.forEach((b,i)=>{const d=document.createElement('div');d.className='breed';d.innerHTML=`<div class="emo">${b.e}</div><h3>${b.n}</h3><p>${b.d}</p>`;d.onclick=()=>{breed=b;level=1;score=0;lives=b.lives;audio();startLevel()};bl.appendChild(d)});
function togglePause(){paused=!paused;document.getElementById('pauseS').classList.toggle('hidden',!paused)}
function toMenu(){state='menu';paused=false;hideAll();document.getElementById('menu').classList.remove('hidden')}
function nextLevel(){level++;startLevel()}
function restart(){level=1;score=0;lives=breed.lives;startLevel()}
// --- Game loop ---
function jump(){if(dog.onG){dog.vy=-15*breed.jmp;dog.onG=false;beep(500,.15)}else if(dog.dj>0&&!dog.djUsed){dog.vy=-13*breed.jmp;dog.djUsed=true;beep(700,.15)}}
let jumpHeld=false;
function update(){
 if(state!=='play'||paused)return;
 const up=keys['arrowup']||keys['w'],dn=keys['arrowdown']||keys['s'];
 if(up&&!jumpHeld)jump();jumpHeld=!!up;
 dog.duck=dn?breed.duck:0;
 const spd=5*breed.spd*(dog.spdT>0?1.5:1)*(1+level*.05);
 camX+=spd;score+=Math.round(spd*(dog.mult>0?2:1)*.1);
 dog.vy+=.8;dog.y+=dog.vy;dog.onG=false;
 const h=dog.duck?22:40;
 // ground & holes
 let groundY=GY;
 const overHole=obs.some(o=>o.t==='hole'&&dog.x+dog.w>o.x&&dog.x<o.x+o.w);
 if(overHole)groundY=H+300;
 if(dog.y>=groundY){if(groundY>H){loseLife();return}dog.y=groundY;dog.vy=0;dog.onG=true;dog.djUsed=false}
 // platforms
 plats.forEach(p=>{if(dog.vy>=0&&dog.x+dog.w>p.x&&dog.x<p.x+p.w&&dog.y>=p.y&&dog.y-dog.vy<=p.y){dog.y=p.y;dog.vy=0;dog.onG=true;dog.djUsed=false}});
 // obstacles
 if(dog.inv<=0)obs.forEach(o=>{if(o.t==='hole')return;if(dog.x+dog.w>o.x&&dog.x<o.x+o.w&&dog.y>o.y&&dog.y-h<o.y+o.h){loseLife()}});
 // enemies
 enemies.forEach(e=>{e.x+=e.spd;if(e.x>e.x0+e.range||e.x<e.x0)e.spd*=-1;
  if(dog.inv<=0&&dog.x+dog.w>e.x&&dog.x<e.x+e.w&&dog.y>e.y&&dog.y-h<e.y+e.h){
   if(dog.vy>2){e.dead=true;score+=100*(dog.mult>0?2:1);dog.vy=-10;beep(300,.2)}else loseLife()}});
 enemies=enemies.filter(e=>!e.dead);
 // powerups
 pows=pows.filter(p=>{if(dog.x+dog.w>p.x&&dog.x<p.x+p.w&&dog.y>p.y&&dog.y-h<p.y+p.h){applyPow(p.t);return false}return true});
 if(dog.inv>0)dog.inv--;if(dog.dj>0)dog.dj--;if(dog.spdT>0)dog.spdT--;if(dog.mult>0)dog.mult--;if(dog.hurt>0)dog.hurt--;
 dog.anim+=spd*.05;
 // flag
 if(dog.x+camX>flag.x){state='lvl';beep(523,.2);setTimeout(()=>beep(784,.3),200);document.getElementById('lvlP').textContent=`Punteggio: ${score}`;document.getElementById('lvlS').classList.remove('hidden')}
 dog.x=80; // fixed screen pos; world moves via camX
}
function applyPow(t){beep(880,.2,'sine');
 if(t==='inv')dog.inv=300;if(t==='dj')dog.dj=600;if(t==='spd')dog.spdT=400;
 if(t==='life')lives++;if(t==='mult')dog.mult=500;score+=50}
function loseLife(){
 if(dog.hurt>0)return;lives--;beep(150,.4,'sawtooth');dog.hurt=60;
 if(lives<=0){state='over';document.getElementById('overP').textContent=`Punteggio finale: ${score} — Livello ${level}`;document.getElementById('overS').classList.remove('hidden')}
 else resetDog(false);
}
// --- Drawing ---
function draw(){
 const th=THEMES[(level-1)%THEMES.length];
 ctx.fillStyle=th.sky;ctx.fillRect(0,0,W,H);
 ctx.font='40px serif';
 for(let i=0;i<8;i++){const dx=((i*220-camX*.4)%(W+220)+(W+220))%(W+220)-100;ctx.fillText(th.deco,dx,GY-10)}
 ctx.fillStyle=th.gnd;ctx.fillRect(0,GY,W,H-GY);
 const off=-camX;
 // holes
 obs.forEach(o=>{const x=o.x+off;if(x<-200||x>W+200)return;
  if(o.t==='hole'){ctx.fillStyle='#222';ctx.fillRect(x,GY,o.w,H-GY)}
  else if(o.t==='low'){ctx.fillStyle='#c0392b';ctx.fillRect(x,o.y,o.w,o.h);ctx.fillStyle='#e74c3c';ctx.fillRect(x,o.y,o.w,8)}
  else{ctx.fillStyle='#8e44ad';ctx.fillRect(x,o.y,o.w,o.h);ctx.fillStyle='#9b59b6';ctx.fillRect(x,o.y,o.w,8)}});
 plats.forEach(p=>{const x=p.x+off;if(x<-200||x>W+200)return;ctx.fillStyle='#a0653a';ctx.fillRect(x,p.y,p.w,p.h);ctx.fillStyle='#7ec850';ctx.fillRect(x,p.y,p.w,6)});
 enemies.forEach(e=>{const x=e.x+off;if(x<-100||x>W+100)return;ctx.font='34px serif';ctx.fillText('😾',x,e.y+30)});
 pows.forEach(p=>{const x=p.x+off;if(x<-100||x>W+100)return;ctx.font='26px serif';const ic={inv:'⭐',dj:'🪶',spd:'⚡',life:'❤️',mult:'✖️'}[p.t];ctx.fillText(ic,x,p.y+24)});
 // flag
 const fx=flag.x+off;ctx.fillStyle='#333';ctx.fillRect(fx,flag.y,6,flag.h);ctx.fillStyle='#2ecc71';ctx.beginPath();ctx.moveTo(fx+6,flag.y);ctx.lineTo(fx+50,flag.y+18);ctx.lineTo(fx+6,flag.y+36);ctx.fill();
 // dog
 const h=dog.duck?22:40,dx=dog.x,dy=dog.y;
 ctx.save();
 if(dog.inv>0&&Math.floor(dog.inv/5)%2)ctx.globalAlpha=.5;
 if(dog.hurt>0)ctx.rotate(.1*Math.sin(dog.hurt));
 ctx.font=(dog.duck?'30px':'40px')+' serif';
 const run=dog.onG?Math.sin(dog.anim)*3:0;
 ctx.fillText(breed.e,dx,dy-4+run);
 if(!dog.onG&&dog.vy<0){ctx.font='16px serif';ctx.fillText('💨',dx-10,dy-30)}
 ctx.restore();
 // HUD
 document.getElementById('hBreed').textContent=breed?breed.e+' '+breed.n:'';
 document.getElementById('hLives').textContent='❤️'.repeat(Math.max(0,lives));
 document.getElementById('hScore').textContent='⭐ '+score;
 document.getElementById('hLevel').textContent='Lv '+level+' • '+th.n;
 let pw=[];if(dog.inv>0)pw.push('⭐inv');if(dog.dj>0)pw.push('🪶2x');if(dog.spdT>0)pw.push('⚡');if(dog.mult>0)pw.push('✖️2');
 document.getElementById('hPow').textContent=pw.join(' ');
 document.getElementById('pbar').style.width=Math.min(100,camX/levelLen*100)+'%';
}
function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
